name: Reproducibility Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: artifacts/requirements.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r artifacts/requirements.txt
          pip install "pytest>=8.3,<9"
      - name: Verify frozen release metrics
        env:
          PYTHONPATH: scripts:artifacts
        run: python scripts/verify_release.py
      - name: Strict provenance validation
        env:
          PYTHONPATH: scripts:artifacts
        run: |
          python scripts/validate_analysis.py \
            artifacts/non_oracle_defer_results_2026_05_full_analysis.json \
            --strict-provenance
      - name: Pytest
        run: pytest -q tests

  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./artifacts
          load: true
          tags: airi-defer-sim:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run simulation (single seed)
        run: |
          mkdir -p artifacts/out
          docker run --rm \
            -v "${{ github.workspace }}/artifacts/out:/app/out" \
            airi-defer-sim:latest \
            python non_oracle_defer_simulation_2026_05.py --seed 20260501 --out out/results.json
      - uses: actions/upload-artifact@v5
        with:
          name: simulation-results
          path: artifacts/out/
          retention-days: 14
